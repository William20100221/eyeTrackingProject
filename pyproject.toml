[project]
name = "eyetrackingproject"
version = "0.2.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.13.0",
    "google-genai>=2.31.0",
    "materialyoucolor>=3.0.4",
    "mediapipe>=1.0.1",
    "openai>=3.35.1",
    "opencv-contrib-python>=5.0.0.93",
    "pygrabber>=0.2; sys_platform == 'win32'",          # camera names (DirectShow)
    "pyside6>=6.11.2",
    "scikit-learn>=1.9.1",
    "winocr>=0.0.15; sys_platform == 'win32'",         # OCR of a window's picture
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
