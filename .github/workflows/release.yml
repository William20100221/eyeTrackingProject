# Build Study Assistant on Windows, macOS and Linux, and publish the three downloads as a GitHub release.
#
#   Push a tag v<version> (the version in pyproject.toml) -> a release with all three downloads.
#   Actions > Release > Run workflow                          -> the same builds, kept as artifacts only.
#
# Each machine runs installer/build.py: PyInstaller, the frozen app's --self-test, then that system's
# download (see installer/RELEASING.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # the release job creates the release

jobs:
  build:
    strategy:
      fail-fast: false     # one system failing doesn't stop the others' builds
      matrix:
        include:
          - os: windows-latest   # x64
          - os: macos-latest     # Apple Silicon (MediaPipe has no Intel-Mac build)
          - os: ubuntu-24.04     # x64 (pinned: ubuntu-latest moves to 26 from 19 Oct 2026)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3   # setup-uv has no major-version tags: an exact release
        with:
          python-version: "3.14"   # as .python-version: 3.15's lazy imports break MediaPipe in the frozen app,
                                   # and matplotlib has no Windows wheel for it yet
      - name: Linux libraries Qt and MediaPipe load (the self-test runs Qt offscreen)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgles2 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - run: uv sync --locked
      - name: MediaPipe from source (macOS, a check of the machine)
        if: runner.os == 'macOS'
        continue-on-error: true   # GitHub's Macs are VMs without a GPU, where MediaPipe aborts: this shows whether it's
                                  # the machine (it fails from source too) or the packaging (it passes here)
        run: uv run python -c "import numpy as np; from eyetracking.services.landmarker import FaceLandmarker; lm = FaceLandmarker(); print('from source:', lm.detect(np.zeros((480, 640, 3), dtype=np.uint8)).face_found)"
      - run: uv run python installer/build.py
        env:
          SELF_TEST_NO_LANDMARKER: ${{ runner.os == 'macOS' && '1' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: download-${{ runner.os }}
          path: installer/Output/StudyAssistant-*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: downloads
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd downloads
          sha256sum StudyAssistant-* > SHA256SUMS.txt
          sed "s/<version>/${GITHUB_REF_NAME#v}/g" ../installer/release-notes.md > notes.md   # the file names in the notes
          gh release create "$GITHUB_REF_NAME" StudyAssistant-* SHA256SUMS.txt \
            --title "Study Assistant ${GITHUB_REF_NAME#v}" --notes-file notes.md --prerelease
